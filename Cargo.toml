[workspace]
members = ["src-tauri", "crates/lychi-core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking file logging (dedicated worker thread) + daily rotation. First-
# party companion to `tracing`, same maintainers — the standard production setup.
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
directories = "6"
toml = "1"
redb = "4"
uuid = { version = "1", features = ["v7", "v4"] }
postcard = { version = "1", features = ["alloc"] }
chrono-tz = "0.10"
# User-configurable shell allow/deny rules compile to regexes. Already present
# transitively (via other deps), so a direct dependency adds no new crates.
regex = "1"
# Type-introspection for generated TypeScript IPC bindings (tauri-specta).
# Pinned to the exact RC the tauri-specta RC requires — they move in lockstep.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
# Local AI (feature = "local-ai"): CPU inference via llama.cpp Rust bindings.
# default-features off = CPU-only, statically-linked llama.cpp (no CUDA/Vulkan/
# BLAS/OpenMP), giving a single self-contained binary that's portable across
# x86-64 (AVX2 baseline via .cargo/config.toml). ~3-6x faster on CPU than the
# pure-Rust path. Weights are downloaded at runtime, so this adds only the engine.
# `common` is llama.cpp's non-GPU helper layer — it provides grammar-constrained
# sampling (our JSON output mode) + the sampler chain; CPU-only, no extra runtime
# deps, so it keeps the single-static-binary property.
llama-cpp-2 = { version = "0.1.151", default-features = false, features = ["common"] }

# --- Build profiles ---
#
# Fat LTO + single codegen unit for the shipped build. Our Rust hot paths (fuzzy
# matching, etc.) benefit; the llama.cpp engine itself is compiled by cmake with
# its own optimization flags, independent of these. Cheap, safe, no dep cost.
[profile.release]
lto = "fat"
codegen-units = 1
