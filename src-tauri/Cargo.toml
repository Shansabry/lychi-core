[package]
name = "lychi-app"
version.workspace = true
edition.workspace = true

[lib]
name = "lychi_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["mpris"]
mpris = ["lychi-core/mpris"]
# Bundled local AI (CPU inference via Candle). Off by default; enable with
# `--features local-ai` to include the engine. Model weights download at runtime.
local-ai = ["lychi-core/local-ai"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lychi-core = { path = "../crates/lychi-core" }
redb = { workspace = true }
dirs = "6"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
# Generated, typesafe IPC bindings — Rust command/type defs → src/lib/bindings.ts.
specta = { workspace = true }
tauri-specta = { version = "2.0.0-rc", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
libc = "0.2"
keyring = "4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
futures-util = "0.3"
ignore = "0.4"
nucleo-matcher = "0.3.1"
nucleo = "0.5"
notify = "8"
base64 = "0.22"
async-trait = { workspace = true }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
zbus = { version = "5", features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
# KDE plasma-shell protocol: hide the toplevel window from taskbar/switcher
# on KDE Wayland (skip_taskbar_hint only sets X11 atoms — tauri#9829 / I-009)
# XDG GlobalShortcuts portal — compositor-level hotkey on Wayland
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
gtk = "0.18"
gdk = "0.18"
gio = "0.18"
glib = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
# Reaching the WebKitWebView behind Tauri's PlatformWebview, to switch off the
# multimedia stack Lychi never uses (see platform::linux::harden_webview).
#
# Pinned `=` to match wry's own exact pin: both must resolve to ONE version or
# the `WebViewExt` we call is a different type from the one Tauri hands us. A
# wry bump then breaks the build loudly at compile time, which is the point —
# the alternative is two webkit2gtk copies and a confusing type mismatch.
#
# v2_38 matches the feature wry already enables, so this adds no new API
# surface beyond what is compiled in regardless. set_enable_webrtc needs it.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
