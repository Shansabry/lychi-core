[package]
name = "lychi-core"
version.workspace = true
edition.workspace = true

[features]
default = ["mpris"]
mpris = ["dep:zbus", "dep:futures-core"]
# Bundled local AI (CPU inference via llama.cpp, statically linked). Optional +
# OUT of default so normal builds don't pull the ML engine. Model weights are
# downloaded on first use (not bundled), so this only adds the engine, not
# gigabytes. llama-cpp-2 vendors + statically links llama.cpp (CPU-only, no
# CUDA/BLAS/OpenMP runtime deps by default) — one self-contained binary.
local-ai = ["dep:llama-cpp-2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
async-trait = { workspace = true }
directories = { workspace = true }
toml = { workspace = true }
redb = { workspace = true }
uuid = { workspace = true }
postcard = { workspace = true }
urlencoding = "2.1"
which = "8"
nix = { version = "0.31", features = ["signal", "process"] }
dirs = "6"
ignore = "0.4"
nucleo-matcher = "0.3.1"
nucleo = "0.5"
freedesktop-icons = "0.4"
arc-swap = "1"
notify = "8"
meval = "0.2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
# File utilities (Phase 1): archives + magic-byte MIME sniffing. All pure-Rust
# (no native libs) to keep the AppImage lean. zip >= 2.3.0 is required — earlier
# versions have a symlink zip-slip (RUSTSEC GHSA-94vh-gphv-8pm8); we extract via
# `enclosed_name()` + a canonicalize-under-dest guard regardless.
zip = "8"
tar = "0.4"
flate2 = "1"
infer = "0.22"
mime_guess = "2"
# Doc text extraction (Phase 3): docx/odt/pptx/xlsx are ZIP+XML containers we read
# with `zip` (already above) + a streaming XML pull-parser. Pure-Rust, no native libs.
quick-xml = "0.37"
# PDF text extraction (Phase 3). Pure-Rust, MIT, no native libs (built on lopdf).
# Known to PANIC on some malformed PDFs — we ALWAYS wrap it in `catch_unwind`
# (see files/text_extract.rs `pdf_backend`), so a bad PDF degrades to an error,
# never a crash. Chosen over pdf_oxide/ferrules/extractous (native/ML deps) for
# the lean AppImage goal.
pdf-extract = "0.12"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.4"
notify-rust = "4"
emojis = "0.9"
unicode_names2 = "3"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
zbus = { version = "5", features = ["tokio"], optional = true }
# Not optional: the model downloader (streamed) needs StreamExt independent of
# the mpris/local-ai features. Tiny crate.
futures-util = "0.3"
futures-core = { version = "0.3", optional = true }
# Streaming provider seam: ReceiverStream (sync spawn_blocking → async Stream
# bridge for the local engine) + CancellationToken (uniform cancel across all
# providers; the local spawn_blocking loop can't be aborted by drop, so it polls
# the token each token — see providers/mod.rs StreamEvent seam).
tokio-stream = "0.1"
tokio-util = "0.7"
async-stream = "0.3"
# Local AI (feature = "local-ai"): CPU inference via statically-linked llama.cpp.
# default-features off = CPU-only, static (no CUDA/Vulkan/BLAS/OpenMP), so the
# AppImage stays a single self-contained binary. Built with an AVX2 baseline
# (see .cargo/config.toml) for portability across x86-64.
llama-cpp-2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
dbus = { version = "0.9", default-features = false }
# Wayland client + wlr foreign-toplevel protocol: the standards-based window
# enumeration / focus / close backend for wlroots compositors (Sway, Hyprland,
# niri, Wayfire, COSMIC), where neither the KWin script nor X11 EWMH backends
# apply. Versions match src-tauri's existing wayland stack.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
