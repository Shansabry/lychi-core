name: CI

# Runs on every PR and every push to main. This is the gate that lets an
# outside PR (or a Dependabot bump) be trusted without building it by hand.
#
# ─── Architecture (2026-08 rewrite, aligned with what tokio / ruff /
#     rust-analyzer / tauri itself actually run) ────────────────────────────
#
#   • Independent, fully parallel jobs. The old "compile once, fan out over a
#     shared cache" staging is gone: no serious Rust project does it, because
#     restored-from-main caches already give every job warm dependencies and
#     the staging only added latency and cross-job coupling.
#   • Each job restores its own rust-cache (default per-job key) and only
#     main writes caches — PR branches read but never publish, so the 10GB
#     repo budget holds exactly one steady-state cache per job.
#   • System deps come from ONE composite action (.github/actions/linux-deps)
#     instead of four drifting copies of the same apt block.
#   • Every third-party action is pinned to a full commit SHA (post
#     tj-actions/changed-files supply-chain attack orthodoxy; Dependabot's
#     github-actions ecosystem keeps the pins fresh).
#   • The `ci` aggregate job is the ONLY ruleset-required check and inspects
#     every result explicitly — a skipped job passes (the licences job
#     self-gates), anything else fails.
#   • Workflows lint themselves: actionlint (correctness) + zizmor (security).

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run. Keyed on PR number, with
# the SHA as fallback so pushes to main NEVER cancel each other — main runs
# write the caches and must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds once, so the incremental cache is pure overhead.
  CARGO_INCREMENTAL: "0"
  # No debuginfo in CI: significantly faster compiles and smaller caches.
  # Panic backtraces still show symbol names, just not line numbers.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Least-privilege token: every job here only reads the repo.
permissions:
  contents: read

jobs:
  # ── Formatting + the workflows' own linters. No compilation, no apt. ───────
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rustfmt only — `cargo fmt --check` does not need the project to build.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust formatting
        run: cargo fmt --all --check

      # Workflow files are the one thing CI cannot check by running: a syntax
      # error means GitHub rejects the file, produces ZERO jobs, and reports a
      # 0-second failure with no log. actionlint catches that class before it
      # can merge.
      - name: Lint workflows (actionlint)
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: 1.7.7

      # zizmor audits the workflows for security smells: template injection,
      # cache poisoning, excessive permissions, impostor commits. The de-facto
      # standard auditor (CPython, cURL, uv run it in CI).
      - name: Audit workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.29.0 --min-severity high .

  # ── Rust: lint ─────────────────────────────────────────────────────────────
  clippy:
    name: Rust / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri.conf.json declares the CLI as an externalBin and bundles the
      # notices file as a resource; both are generated, so a clean checkout has
      # neither and anything that compiles lychi-app (clippy --all-targets
      # included) aborts without them. The notices stub is deliberate: nothing
      # here reads its contents — the licences job audits the real graph, and
      # the release workflow generates the real file.
      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu
      - name: Stub bundled notices
        run: echo '<!-- placeholder; real notices come from the release workflow -->' > THIRD-PARTY-NOTICES.html

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Rust: tests + the bindings-drift guarantee ─────────────────────────────
  test:
    name: Rust / test + bindings
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt binary (~3s). nextest runs each test in its own process and
      # retries flaky ones — a retried-then-passed test is reported FLAKY, so
      # flakiness stays visible instead of being a manual rerun ritual.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-nextest

      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu
      - name: Stub bundled notices
        run: echo '<!-- placeholder -->' > THIRD-PARTY-NOTICES.html

      # local-ai is deliberately excluded: it statically links llama.cpp, which
      # dominates CI time. The local-ai job type-checks that feature; the
      # release workflow builds it for real.
      - name: Test
        run: cargo nextest run --workspace --retries 2
        env:
          RUST_BACKTRACE: "1"

      # nextest does not run doctests; keep them covered separately.
      - name: Doctests
        run: cargo test --workspace --doc

      # The export_bindings test rewrites src/lib/bindings.ts. If that differs
      # from the committed copy, someone changed a #[tauri::command] without
      # regenerating, and the frontend types are a lie. This is the guarantee
      # that makes committing a generated file safe.
      - name: Check bindings are up to date
        run: |
          cargo test -p lychi-app export_bindings
          if ! git diff --exit-code --stat -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts is stale. Run: cargo test -p lychi-app export_bindings"
            exit 1
          fi

  # ── Rust: the release feature set must keep compiling ──────────────────────
  # The release build REQUIRES local-ai, but the test job deliberately excludes
  # it (llama.cpp dominates CI time when built for real). That gap let
  # feature-gated code rot: ChatMessage grew two fields and the local-ai tests
  # stopped compiling with nothing failing (AI-4). This type-checks the feature
  # — including its #[ignore]d model tests — without running anything.
  # lychi-core has no Tauri deps by architecture rule, so no GTK/WebKit stack;
  # cmake/clang for llama.cpp's build come preinstalled on the runner.
  local-ai-check:
    name: Rust / local-ai check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/linux-deps
        with:
          tauri: "false"
          extra: libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check local-ai (lib + tests)
        run: cargo check -p lychi-core --features local-ai --tests

  # ── The two window backends no developer machine can test ──────────────────
  # `active_window::detect` dispatches to exactly three backends, and desktop
  # environments collapse onto them — so this matrix is keyed on BACKEND, not
  # on DE:
  #   wlroots   Sway, Hyprland, river, Wayfire, niri, COSMIC  → one job
  #   x11       every X11 session on every desktop            → one job
  #   KWin      needs a full Plasma session; both dev machines run it daily
  #   GNOME     `_ => None` by design — Mutter exposes no detection interface
  # Add a job when a fourth BACKEND appears, not a fourth desktop.
  env-tests:
    name: Backend / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # Headless Sway really does advertise
          # zwlr_foreign_toplevel_manager_v1 — KDE and GNOME never do, which is
          # how the Sway SIGABRT (I-011) shipped: a Wayland dispatch that
          # panics does so inside a C callback and aborts the process.
          # Verified by mutation: deleting the `event_created_child!`
          # specialization reproduces the original crash.
          - backend: wlroots
            packages: sway foot
            script: ./scripts/test-wlroots.sh
          # The X11 EWMH backend's failure mode is silent: a wrong atom name
          # compiles fine and returns None, indistinguishable from "no window
          # focused". Verified by mutation: typo'ing `_NET_WM_PID` fails it.
          - backend: x11
            packages: xvfb openbox xterm x11-utils xdotool
            script: ./scripts/test-x11.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Core-only compile: no Tauri stack, so these stay lean on purpose.
      - uses: ./.github/actions/linux-deps
        with:
          tauri: "false"
          extra: ${{ matrix.packages }} libdbus-1-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner has no session bus and no XDG_RUNTIME_DIR; Sway needs one to
      # put its socket in, and it must be 0700 or wlroots refuses to start.
      # Harmless for the X11 job.
      - name: Run ${{ matrix.backend }} tests
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          # Declared then assigned: `export X="$(cmd)"` returns export's
          # status, so a failing mktemp would sail past `set -e`.
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          "$SCRIPT"

  # ── Frontend: lint + test + typecheck, Node only ───────────────────────────
  # No Rust toolchain here on purpose. src/lib/bindings.ts is committed, so the
  # frontend is checkable with Node alone — which is also what a frontend-only
  # contributor needs locally. The test job verifies the committed copy.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # svelte-check re-resolves every dependency's types on a cold run. The
      # .svelte-kit dir is generated (sync) and safe to reuse for a given
      # config + lockfile; a miss just regenerates it.
      - name: Cache SvelteKit artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .svelte-kit
          key: svelte-kit-${{ hashFiles('pnpm-lock.yaml', 'svelte.config.js', 'vite.config.ts', 'tsconfig.json') }}

      - name: Test
        run: pnpm test:fe

      # svelte-check runs last: it's the slowest, and it runs SvelteKit's own
      # sync to generate the $app/* types it needs.
      - name: Type check
        run: pnpm check

  # ── Licence audit: only runs when the dependency graph actually moves ──────
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history for the diff below — the default shallow checkout cannot
      # compare against the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # This job can only ever fail when a dependency changes, so gate the
      # expensive part on the graph having actually moved. GitHub has no
      # per-job `paths:` filter, so the filter lives here as an explicit diff.
      - name: Did the dependency graph change?
        id: changed
        # `github.event.*` is externally influenced, so it arrives as an env
        # var rather than being spliced into the script text.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # First push to a branch, or a force-push with no usable base: check.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" HEAD -- Cargo.toml Cargo.lock about.toml 'crates/**/Cargo.toml' src-tauri/Cargo.toml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No manifest or lockfile change — the licence graph cannot have moved."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.changed.outputs.run == 'true'
        with:
          toolchain: stable

      # Prebuilt binary: 3 seconds instead of a minutes-long `cargo install`.
      - uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-about

      # Fails on any dependency whose licence is not in about.toml's accepted
      # list. Lychi is GPL-3.0-only, so a crate under GPL-2.0-only, AGPL, SSPL,
      # BUSL, CDDL or EPL would be a real distribution problem — and one added
      # transitively is invisible until someone audits by hand. This is the
      # audit, run whenever the graph moves.
      - name: Check licences
        if: steps.changed.outputs.run == 'true'
        run: cargo about generate about.hbs --features local-ai -o /dev/null

  # ── The single required-status target for branch protection ────────────────
  # Without this, adding a job means editing the protected-branch rules by
  # hand, and a forgotten one silently stops gating. EVERY meaningful job must
  # be named in `needs`: the ruleset requires only this aggregate, and a
  # missing entry is an invisible hole.
  ci:
    name: CI
    # `!cancelled()` rather than `always()`: run even when a dependency failed
    # (so the check reports a real failure instead of staying pending forever),
    # but not when the whole run was cancelled.
    if: ${{ !cancelled() }}
    needs: [quick, clippy, test, local-ai-check, env-tests, frontend, licenses]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The expression goes through `env:`, not straight into the script:
      # an env var is passed as data and cannot be re-parsed as shell.
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            # `skipped` is legitimate — the licences job self-gates.
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
