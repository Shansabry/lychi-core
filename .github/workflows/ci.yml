name: CI

# Runs on every PR and every push to main. This is the gate that lets an
# outside PR (or a Dependabot bump) be trusted without building it by hand.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run — no point finishing a
# build for a commit that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units and no incremental artifacts: CI builds once, so the
  # incremental cache is pure overhead here.
  CARGO_INCREMENTAL: "0"

# ─────────────────────────────────────────────────────────────────────────────
# Staged so the cheap, high-signal checks fail first.
#
#   stage 1  quick        formatting + frontend lint      ~30s, no compilation
#   stage 2  build        one shared Rust compile         the expensive part
#   stage 3  rust-checks  clippy / test / bindings        matrix, reuses stage 2
#            env-tests    wlroots + X11                   matrix, own compile
#            frontend     test + typecheck
#   any      licenses     only when the dep graph moves
#
# The point of stage 1 is that a missing `cargo fmt` should cost 30 seconds, not
# a full toolchain install and a workspace compile. Stage 3's matrices then fan
# out over a warm cache, so clippy and test run concurrently rather than
# serially in one job.
# ─────────────────────────────────────────────────────────────────────────────

# Least-privilege token: every job here only reads the repo. Pinned explicitly
# so the default (broader) token permissions never apply (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  # ── Stage 1: fail fast on things that need no compilation ──────────────────
  quick:
    name: Quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # rustfmt only — no GTK/WebKit, no dependency compile. This is why it is
      # a separate job: `cargo fmt --check` does not need the project to build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust formatting
        run: cargo fmt --all --check

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm lint

      # Workflow files are the one thing CI cannot check by running: a syntax
      # error means GitHub rejects the file, produces ZERO jobs, and reports a
      # 0-second failure with no log. That is exactly how a `" "` separator in
      # a `join()` expression (GitHub expressions take only single quotes) broke
      # every push to main for three days while every local gate stayed green.
      #
      # actionlint is a single static binary — no toolchain, no install step —
      # and it catches that class before it can merge.
      - name: Lint workflows
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: 1.7.7

  # ── Stage 2: the one expensive Rust compile ────────────────────────────────
  #
  # Everything in `rust-checks` needs the same dependency build. Doing it once
  # here and letting the matrix restore it beats three jobs each compiling the
  # workspace from scratch.
  build:
    name: Build (shared cache)
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Tauri needs the full GTK/WebKit stack even to type-check, because the
      # -sys crates run pkg-config at build time.
      #
      # Deliberately NOT cached: actions/cache runs as a non-root user and
      # can't read /var/cache/apt/archives, and the third-party apt-cache
      # actions would mean trusting an unpinned action in CI for a modest win.
      # The package list matches release.yml's proven set.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libssl-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Keyed on the lockfile and rustc version by default. `save-if` means only
      # main writes the cache: PR branches read it but don't each push their own
      # copy, which would evict main's shared entry under the 10GB repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: workspace

      # tauri.conf.json declares the CLI as an externalBin, so lychi-app's build
      # script refuses to run without it — and src-tauri/binaries/ is gitignored,
      # so a clean checkout never has one. Anything that compiles lychi-app
      # (including `clippy --all-targets`) needs this first.
      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu

      # tauri.conf.json bundles THIRD-PARTY-NOTICES.html as a resource, and the
      # file is gitignored because it is generated — so a clean checkout has no
      # copy and the build script aborts with:
      #
      #   resource path `../THIRD-PARTY-NOTICES.html` doesn't exist
      #
      # Same shape as the sidecar above: a generated artefact that anything
      # compiling lychi-app needs to already be on disk.
      #
      # A placeholder rather than the real thing, deliberately. Generating it
      # needs `cargo install cargo-about`, which costs minutes on every run of
      # this job — and nothing here reads the contents. The licence audit that
      # DOES care runs in the `licenses` job, and the release workflow generates
      # the real file for the artefact users actually receive.
      - name: Stub bundled notices
        run: |
          echo '<!-- placeholder; real notices come from the release workflow -->' > THIRD-PARTY-NOTICES.html

      # Compile test and clippy artifacts here so the matrix below only has to
      # run them. `--no-run` builds the test binaries without executing them.
      - name: Warm the build cache
        run: |
          cargo test --workspace --no-run
          cargo clippy --workspace --all-targets -- -D warnings

  # ── Stage 3a: Rust checks, fanned out over the warm cache ──────────────────
  rust-checks:
    name: Rust / ${{ matrix.check }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing check should not cancel the others — knowing whether BOTH
      # clippy and the tests are broken is more useful than learning it twice.
      fail-fast: false
      matrix:
        check: [test, clippy, bindings]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Reads the cache `build` just populated. Never writes: these jobs add
      # nothing a later run needs, and three concurrent writers would race.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          shared-key: workspace

      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu

      - name: Stub bundled notices
        run: echo '<!-- placeholder -->' > THIRD-PARTY-NOTICES.html

      # local-ai is deliberately excluded: it statically links llama.cpp, which
      # dominates CI time. The release workflow builds with it; correctness of
      # the AI plumbing is covered by tests that don't need the engine.
      - name: Test
        if: matrix.check == 'test'
        run: cargo test --workspace

      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The export_bindings test rewrites src/lib/bindings.ts. If that differs
      # from the committed copy, someone changed a #[tauri::command] without
      # regenerating, and the frontend types are a lie. This is the guarantee
      # that makes committing a generated file safe.
      - name: Check bindings are up to date
        if: matrix.check == 'bindings'
        run: |
          cargo test -p lychi-app export_bindings
          if ! git diff --exit-code --stat -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts is stale. Run: cargo test -p lychi-app export_bindings"
            exit 1
          fi

  # ── Stage 3b: the two window backends no developer machine can test ────────
  #
  # `active_window::detect` dispatches to exactly three backends, and desktop
  # environments collapse onto them — so this matrix is keyed on BACKEND, not on
  # DE. Five DE jobs would be three copies of one test plus two that cover
  # nothing:
  #
  #   wlroots   Sway, Hyprland, river, Wayfire, niri, COSMIC  → one job
  #   x11       every X11 session on every desktop            → one job
  #   KWin      needs a full Plasma session on a session bus; heavy and flaky
  #             headless, and it is the backend both dev machines exercise daily
  #   GNOME     `_ => None` by design — Mutter implements neither
  #             wlr-foreign-toplevel nor a scripting interface, so there is no
  #             detector and nothing to assert
  #
  # Add a job when a fourth BACKEND appears, not a fourth desktop.
  #
  # Both only need lychi-core, so they skip the WebKit/GTK stack entirely and
  # use their own cache key.
  # The release build REQUIRES local-ai, but the matrix above deliberately
  # excludes it (llama.cpp dominates CI time when built for real). That gap let
  # feature-gated code rot: ChatMessage grew two fields and the local-ai tests
  # stopped compiling with nothing failing (AI-4). This job type-checks the
  # feature — including its #[ignore]d model tests — without running anything.
  # Its own cache key: llama.cpp's C++ objects rebuild only when the -sys crate
  # bumps, so warm runs are minutes, not tens of minutes.
  local-ai-check:
    name: Rust / local-ai check
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: local-ai

      - name: Check local-ai (lib + tests)
        run: cargo check -p lychi-core --features local-ai --tests

  env-tests:
    name: Backend / ${{ matrix.backend }}
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Headless Sway really does advertise
          # zwlr_foreign_toplevel_manager_v1 — KDE and GNOME never do, which is
          # why the whole Dispatch state machine is dead code on a developer
          # machine and how the Sway SIGABRT (I-011) shipped. A Wayland dispatch
          # that panics does so inside a C callback, cannot unwind, and aborts
          # the process: total startup failure, not a degraded feature.
          #
          # Verified by mutation: deleting the `event_created_child!`
          # specialization reproduces the original
          # "Missing event_created_child specialization for event opcode 0".
          - backend: wlroots
            packages: sway foot
            script: ./scripts/test-wlroots.sh
          # The X11 EWMH backend is the most widely used of the three and had no
          # test at all. Its failure mode is silent: a wrong atom name or a
          # misparsed property compiles fine and returns None, which is
          # indistinguishable from "no window focused" — a legitimate result.
          #
          # Verified by mutation: typo'ing the `_NET_WM_PID` atom fails it.
          - backend: x11
            packages: xvfb openbox xterm x11-utils xdotool
            script: ./scripts/test-x11.sh
    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.backend }} and build deps
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          # Unquoted on purpose: PACKAGES is a space-separated list that must
          # word-split into separate arguments.
          # shellcheck disable=SC2086
          sudo apt-get install -y $PACKAGES \
            libdbus-1-dev libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # Separate cache from the workspace one: these compile lychi-core only,
      # without the Tauri stack, so sharing a key would thrash both.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: core-only

      # The runner has no session bus and no XDG_RUNTIME_DIR; Sway needs one to
      # put its socket in, and it must be 0700 or wlroots refuses to start.
      # Harmless for the X11 job.
      - name: Run ${{ matrix.backend }} tests
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          # Declared then assigned: `export X="$(cmd)"` returns export's status,
          # not the command's, so a failing mktemp would sail past `set -e`.
          XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_RUNTIME_DIR
          chmod 700 "$XDG_RUNTIME_DIR"
          "$SCRIPT"

  # ── Stage 3c: frontend ─────────────────────────────────────────────────────
  frontend:
    name: Frontend
    needs: quick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No Rust toolchain here on purpose. src/lib/bindings.ts is committed, so
      # the frontend is checkable with Node alone — which is also what a
      # frontend-only contributor needs locally. The rust-checks matrix verifies
      # the committed copy is current.
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # svelte-check re-resolves every dependency's types on a cold run. The
      # .svelte-kit dir is generated (sync) and safe to reuse for a given
      # config + lockfile; a miss just regenerates it.
      - name: Cache SvelteKit artifacts
        uses: actions/cache@v6
        with:
          path: .svelte-kit
          key: svelte-kit-${{ hashFiles('pnpm-lock.yaml', 'svelte.config.js', 'vite.config.ts', 'tsconfig.json') }}

      - name: Test
        run: pnpm test:fe

      # svelte-check runs last: it's the slowest, and it runs SvelteKit's own
      # sync to generate the $app/* types it needs.
      - name: Type check
        run: pnpm check

  # ── Independent: only runs when the dependency graph actually moves ────────
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history for the diff below — the default shallow checkout cannot
      # compare against the base commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Gate the expensive part on the dependency graph having actually moved.
      #
      # `cargo install cargo-about` is a from-source compile costing minutes,
      # and this job can only ever fail when a dependency changes. Measured on
      # this repo: 6 of the last 49 commits touched Cargo.lock, so ~88% of runs
      # were rebuilding the tool to re-check an unchanged graph.
      #
      # GitHub has no per-job `paths:` filter (that is workflow-level, and this
      # workflow must keep running for everything else), so the filter lives
      # here as an explicit diff.
      - name: Did the dependency graph change?
        id: changed
        # `github.event.*` is externally influenced, so it arrives as an env
        # var rather than being spliced into the script text.
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # First push to a branch, or a force-push with no usable base: check.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" HEAD -- Cargo.toml Cargo.lock about.toml 'crates/**/Cargo.toml' src-tauri/Cargo.toml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No manifest or lockfile change — the licence graph cannot have moved."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      # Fails on any dependency whose licence is not in about.toml's accepted
      # list. Lychi is GPL-3.0-only, so a crate under GPL-2.0-only, AGPL, SSPL,
      # BUSL, CDDL or EPL would be a real distribution problem — and one added
      # transitively is invisible until someone audits by hand. This is the
      # audit, run whenever the graph moves.
      #
      # Deliberately NOT building the AppImage: the check is about the graph, so
      # it needs the manifests and nothing else.
      - name: Install cargo-about
        if: steps.changed.outputs.run == 'true'
        run: cargo install cargo-about --locked --features cli

      - name: Check licences and generate notices
        if: steps.changed.outputs.run == 'true'
        run: cargo about generate about.hbs --features local-ai -o /dev/null

  # A single required-status target for branch protection. Without this, adding
  # a matrix leg means editing the protected-branch rules by hand, and a
  # forgotten one silently stops gating.
  ci:
    name: CI
    if: always()
    # EVERY meaningful job must be named here: the branch ruleset requires
    # only this aggregate, and a missing entry is an invisible hole. `build`
    # matters twice over — its own clippy, and because `rust-checks` needs it:
    # a build failure would leave rust-checks SKIPPED, which the allowance
    # below would otherwise wave through.
    needs: [quick, build, rust-checks, local-ai-check, env-tests, frontend, licenses]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The expression goes through `env:`, not straight into the script.
      # Interpolating `${{ }}` into a shell line splices attacker-influenceable
      # text into the script itself; an env var is passed as data and cannot be
      # re-parsed as shell. It also keeps the quoting honest — GitHub
      # expressions accept ONLY single quotes, and the `" "` separator that
      # used to be here made the whole workflow unparseable, so every push to
      # main failed in 0s with no jobs and no log.
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            # `skipped` is legitimate — the licences job self-gates.
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
