name: CI

# Runs on every PR and every push to main. This is the gate that lets an
# outside PR (or a Dependabot bump) be trusted without building it by hand.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR cancels the previous run — no point finishing a
# build for a commit that's already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fewer codegen units and no incremental artifacts: CI builds once, so the
  # incremental cache is pure overhead here.
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri needs the full GTK/WebKit stack even to type-check, because the
      # -sys crates run pkg-config at build time.
      #
      # Deliberately NOT cached: actions/cache runs as a non-root user and
      # can't read /var/cache/apt/archives, and the third-party apt-cache
      # actions would mean trusting an unpinned action in CI for a modest win.
      # The package list matches release.yml's proven set.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libssl-dev libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Keyed on the lockfile and rustc version by default. `save-if` means only
      # main writes the cache: PR branches read it but don't each push their own
      # copy, which would evict main's shared entry under the 10GB repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri.conf.json declares the CLI as an externalBin, so lychi-app's build
      # script refuses to run without it — and src-tauri/binaries/ is gitignored,
      # so a clean checkout never has one. Anything that compiles lychi-app
      # (including `clippy --all-targets`) needs this first.
      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu

      # tauri.conf.json bundles THIRD-PARTY-NOTICES.html as a resource, and the
      # file is gitignored because it is generated — so a clean checkout has no
      # copy and the build script aborts with:
      #
      #   resource path `../THIRD-PARTY-NOTICES.html` doesn't exist
      #
      # Same shape as the sidecar above: a generated artefact that anything
      # compiling lychi-app needs to already be on disk.
      #
      # A placeholder rather than the real thing, deliberately. Generating it
      # needs `cargo install cargo-about`, which costs minutes on every run of
      # this job — and nothing here reads the contents. The licence audit that
      # DOES care runs in the `licenses` job, and the release workflow generates
      # the real file for the artefact users actually receive.
      - name: Stub bundled notices
        run: |
          echo '<!-- placeholder; real notices come from the release workflow -->' > THIRD-PARTY-NOTICES.html

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # local-ai is deliberately excluded: it statically links llama.cpp, which
      # dominates CI time. The release workflow builds with it; correctness of
      # the AI plumbing is covered by tests that don't need the engine.
      - name: Test
        run: cargo test --workspace

      # The export_bindings test rewrote src/lib/bindings.ts above. If that
      # differs from the committed copy, someone changed a #[tauri::command]
      # without regenerating, and the frontend types are a lie. This is the
      # guarantee that makes committing a generated file safe.
      - name: Check bindings are up to date
        run: |
          if ! git diff --exit-code --stat -- src/lib/bindings.ts; then
            echo "::error::src/lib/bindings.ts is stale. Run: cargo test -p lychi-app export_bindings"
            exit 1
          fi

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      # Full history for the diff below — the default shallow checkout cannot
      # compare against the base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate the expensive part on the dependency graph having actually moved.
      #
      # `cargo install cargo-about` is a from-source compile costing minutes,
      # and this job can only ever fail when a dependency changes. Measured on
      # this repo: 6 of the last 49 commits touched Cargo.lock, so ~88% of runs
      # were rebuilding the tool to re-check an unchanged graph.
      #
      # GitHub has no per-job `paths:` filter (that is workflow-level, and this
      # workflow must keep running for everything else), so the filter lives
      # here as an explicit diff.
      - name: Did the dependency graph change?
        id: changed
        run: |
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          # First push to a branch, or a force-push with no usable base: check.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --quiet "$base" HEAD -- Cargo.toml Cargo.lock about.toml 'crates/**/Cargo.toml' src-tauri/Cargo.toml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No manifest or lockfile change — the licence graph cannot have moved."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'

      # Fails on any dependency whose licence is not in about.toml's accepted
      # list. Lychi is GPL-3.0-only, so a crate under GPL-2.0-only, AGPL, SSPL,
      # BUSL, CDDL or EPL would be a real distribution problem — and one added
      # transitively is invisible until someone audits by hand. This is the
      # audit, run whenever the graph moves.
      #
      # Deliberately NOT building the AppImage: the check is about the graph, so
      # it needs the manifests and nothing else.
      - name: Install cargo-about
        if: steps.changed.outputs.run == 'true'
        run: cargo install cargo-about --locked --features cli

      - name: Check licences and generate notices
        if: steps.changed.outputs.run == 'true'
        run: cargo about generate about.hbs --features local-ai -o /dev/null

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Rust toolchain here on purpose. src/lib/bindings.ts is committed, so
      # the frontend is checkable with Node alone — which is also what a
      # frontend-only contributor needs locally. The rust job verifies the
      # committed copy is current.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # svelte-check re-resolves every dependency's types on a cold run. The
      # .svelte-kit dir is generated (sync) and safe to reuse for a given
      # config + lockfile; a miss just regenerates it.
      - name: Cache SvelteKit artifacts
        uses: actions/cache@v4
        with:
          path: .svelte-kit
          key: svelte-kit-${{ hashFiles('pnpm-lock.yaml', 'svelte.config.js', 'vite.config.ts', 'tsconfig.json') }}

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:fe

      # svelte-check runs last: it's the slowest, and it runs SvelteKit's own
      # sync to generate the $app/* types it needs.
      - name: Type check
        run: pnpm check
