name: Release Please

# The whole release ritual: merging the bot's release PR is the release.
# The bot bumps every version file + changelog (from the conventional commits
# commitlint enforces), then creates the tag and a DRAFT GitHub release; the
# tag triggers release.yml, which attaches assets and publishes the draft
# atomically (immutable releases only accept uploads while draft).
#
# REQUIRES the RELEASE_PLEASE_TOKEN secret (fine-grained PAT, this repo,
# Contents + Pull requests read/write): tags created with the default
# GITHUB_TOKEN cannot trigger release.yml — GitHub suppresses workflow
# cascades. Until the secret exists this falls back to GITHUB_TOKEN and the
# tag must be re-pushed by hand to fire the build.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please defers the TAG of a draft release to publish time — but
      # immutable releases only accept assets while DRAFT, so the tag (which
      # triggers release.yml) is created here explicitly. The PAT matters: a
      # GITHUB_TOKEN tag push would not fire the build workflow.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: ${{ steps.rp.outputs.release_created }}
        # Outputs arrive via env, not spliced into the script text — spliced
        # `${{ }}` inside JS is the template-injection shape zizmor flags.
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
          SHA: ${{ steps.rp.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          script: |
            const tag = process.env.TAG;
            const sha = process.env.SHA;
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha });
              core.info(`Created ${tag} at ${sha} — release build will fire`);
            } catch (e) {
              if (e.status === 422) { core.info(`${tag} already exists`); } else { throw e; }
            }
