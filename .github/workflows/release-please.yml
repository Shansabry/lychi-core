name: Release Please

# The whole release ritual: merging the bot's release PR is the release.
# The bot bumps every version file + changelog (from the conventional commits
# commitlint enforces), then creates a DRAFT GitHub release AND its tag; the
# tag triggers release.yml, which attaches assets and publishes the draft
# atomically (immutable releases only accept uploads while draft).
#
# `force-tag-creation` in release-please-config.json is load-bearing: GitHub
# defers a draft release's tag until publish, and a tagless draft is
# INVISIBLE to release-please's own boundary detection — the next release PR
# then sweeps the entire commit history into its changelog (documented in
# googleapis/release-please#1650; happened here as PR #41). Forcing the tag
# at draft time keeps every later computation anchored. The action is the
# ONLY tag writer — never create the release tag anywhere else.
#
# REQUIRES the RELEASE_PLEASE_TOKEN secret (fine-grained PAT, this repo,
# Contents + Pull requests read/write): the action tags with the token it is
# given, and tags created with the default GITHUB_TOKEN cannot trigger
# release.yml — GitHub suppresses workflow cascades. Until the secret exists
# this falls back to GITHUB_TOKEN and the tag must be re-pushed by hand to
# fire the build.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Report
        if: ${{ steps.rp.outputs.release_created }}
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: echo "Draft release + tag ${TAG} created — release build will fire"
