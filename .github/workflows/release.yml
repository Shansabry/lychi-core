name: Release build (AppImage)

# Builds the release AppImage in an Ubuntu 22.04 container so it keeps a
# glibc 2.35 baseline — do NOT build release artifacts on newer distros or
# they won't run on older LTS systems.
#
# glibc is backward- but not forward-compatible: a binary linked against 2.39
# refuses to start on a host with 2.35, while one linked against 2.35 runs on
# everything newer. So the container is pinned to the OLDEST base we intend to
# support, not the newest available. Demonstrated the hard way — a local Fedora
# build (glibc 2.43) could not be shared with a tester at all.
#
# `runs-on: ubuntu-latest` is only the host that runs the container, and is free
# to float. `container:` is the thing that sets the baseline. Bumping the
# container is a support-matrix decision: 24.04 would mean glibc 2.39, dropping
# Ubuntu 22.04 LTS, Debian 12 and RHEL 9. If a toolchain here turns out too old
# (e.g. CMake 3.22 for llama.cpp), install a newer one INSIDE this container
# rather than moving the base.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Nothing at workflow level; each job asks for exactly what it needs.
permissions: {}

# The ubuntu:22.04 CONTAINER's default step shell is plain `sh`, which chokes
# on bashisms (`set -o pipefail`, `shopt`) — v0.1.0's manifest step died on its
# first line this way. Pin bash for every run step.
defaults:
  run:
    shell: bash

jobs:
  # A tag that disagrees with the built version would ship a binary whose
  # About pill and updater manifest contradict the release page. Fail fast
  # instead — the single version bump lives in the files, the tag must match.
  version-guard:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must match tauri.conf.json version
        run: |
          conf_version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "Tag v${tag_version} != tauri.conf.json version ${conf_version} — bump the files first" >&2
            exit 1
          fi

  linux:
    needs: [version-guard]
    # The guard is skipped on non-tag builds; needs+always lets this run then.
    if: always() && (needs.version-guard.result == 'success' || needs.version-guard.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:22.04
    # The release job must WRITE releases (create/attach assets), plus the
    # keyless provenance attestation (sigstore via GitHub).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # linuxdeploy's embedded strip breaks on modern toolchains (.relr.dyn)
      NO_STRIP: "1"
      # Updater signing. Both are empty until the keypair exists, and
      # `createUpdaterArtifacts` stays false in tauri.conf.json until then, so
      # the build is unaffected — an unsigned release simply produces no
      # `.sig`/`latest.json` and installed copies keep reporting "not
      # configured" rather than failing a signature check.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # `cmake clang libclang-dev` are for `local-ai`: llama-cpp-sys-2 compiles
      # llama.cpp with CMake and generates its bindings with bindgen, which
      # dlopens libclang. They are NOT needed by `ci.yml`, which builds without
      # `--features local-ai` — so this is the one job that requires them, and
      # the failure only ever shows up here.
      #
      # Not obvious from a dev box: Fedora/Arch ship clang and cmake as part of
      # a normal toolchain, so the local `pnpm build` succeeds while the
      # container fails with "Unable to find libclang". Same shape as the
      # codec-bundling bug in I-012 — the build host is not the target.
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential curl wget file pkg-config patchelf git \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libgtk-layer-shell-dev \
            libssl-dev libdbus-1-dev xdg-utils desktop-file-utils \
            cmake clang libclang-dev \
            xz-utils ca-certificates rpm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # `standalone: true` installs @pnpm/exe — pnpm with Node.js bundled in.
      #
      # Required because this job runs inside a bare `ubuntu:22.04` container
      # with no Node. The action's default path self-installs via `npm`, which
      # fails there with `spawn npm ENOENT`. `ci.yml` keeps the plain form
      # because it runs directly on the GitHub runner, which ships Node — so the
      # two workflows differ on purpose, not by oversight.
      #
      # pnpm stays FIRST so `cache: pnpm` on setup-node can resolve the store
      # path (it shells out to pnpm to find it), which is the documented order.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          # v7 auto-caches when package.json names a package manager — opt out.
          package-manager-cache: false

      # Deliberately NO caches in this workflow — not cargo, not pnpm. A cache
      # saved on a tag ref is write-once garbage (1.2GB of dead weight per
      # release, and the mechanism behind the stale-AppImage incident), and a
      # restored cache is a poisoning vector into a published artifact
      # (zizmor: cache-poisoning). A release earns a clean, deterministic
      # build; the few extra minutes are the point.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI sidecar
        run: |
          cargo build --release -p lychi-cli
          mkdir -p src-tauri/binaries
          cp target/release/lychi src-tauri/binaries/lychi-x86_64-unknown-linux-gnu

      # The AppImage builds FIRST and alone, deb/rpm in their own later step.
      # The one time all formats shared a step, an icon error in the deb path
      # produced zero downloads including the AppImage — the primary artifact
      # must never depend on a secondary bundler succeeding.
      #
      # --features local-ai bakes the bundled llama.cpp CPU-inference engine
      # into the release (statically linked; runtime AI-mode switching is pure
      # config). The AVX2 baseline (crates/lychi-core/.cargo/config.toml) keeps
      # it portable across x86-64.
      # The AppImage ships THIRD-PARTY-NOTICES.html as a bundled resource (see
      # tauri.conf.json), because MIT/BSD/Apache/MPL all require their notices
      # to travel WITH the binary — having them in the repo is not enough.
      # Generated here rather than committed so they can never describe a
      # different dependency set than the binary beside them.
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --locked --features cli
          cargo about generate about.hbs --features local-ai -o THIRD-PARTY-NOTICES.html

      # The cache restores `target/` wholesale, including bundle outputs from
      # earlier runs — v0.1.2 shipped a stale v0.1.0 AppImage because the sign
      # and manifest steps globbed the OLD file. Purge before building so the
      # bundle dir only ever holds this build's artifact.
      - name: Clean stale bundle outputs
        run: rm -rf target/release/bundle/appimage target/release/bundle/deb target/release/bundle/rpm

      - name: Build AppImage
        run: pnpm exec tauri build --verbose --bundles appimage --features local-ai

      # linuxdeploy recursively bundles WebKitGTK's GStreamer codec/crypto stack
      # (mp3lame, mpg123, gsm, nettle/hogweed, pulse, ...). Those bundled copies'
      # ELF constructors segfault at _dl_init on newer-glibc HOSTS (the AppImage
      # crashes on launch before main()). They must come from the host instead.
      # Build on the glibc-2.35 baseline above AND strip these from the AppImage
      # so the loader falls through to the host's working copies. See docs/issues
      # (AppImage codec _dl_init crash) for the full diagnosis.
      - name: Strip over-bundled codec libs from the AppImage
        run: bash scripts/fix-appimage-codecs.sh

      # Sign AFTER the strip: the bundler's own signature (if any) covers the
      # pre-strip bytes and would fail verification against what we actually
      # ship. This signature is over the final artifact.
      - name: Sign the final AppImage
        if: startsWith(github.ref, 'refs/tags/v') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ ${#appimages[@]} -ne 1 ]; then
            echo "Expected exactly ONE AppImage, found ${#appimages[@]}: ${appimages[*]}" >&2
            exit 1
          fi
          pnpm tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "${appimages[0]}"

      # AFTER the AppImage chain is complete, so a deb/rpm bundler failure can
      # never cost the primary artifact. The compile is warm — this re-runs
      # only the frontend build and the two bundlers. Unlike the AppImage,
      # deb/rpm declare their libraries as PACKAGE DEPENDENCIES (no bundled
      # GStreamer stack), so the codec strip does not apply to them; and only
      # the AppImage self-updates — deb/rpm installs defer to the package
      # manager (gated at runtime by lychi_core::install), so no .sig and no
      # updater manifest entry for these.
      - name: Build deb and rpm packages
        run: pnpm exec tauri build --bundles deb,rpm --features local-ai

      # A format we ship is a format we verify: both files must exist, be
      # readable by their native tools, and actually contain the binary.
      - name: Verify deb and rpm packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          rpms=(target/release/bundle/rpm/*.rpm)
          if [ ${#debs[@]} -ne 1 ] || [ ${#rpms[@]} -ne 1 ]; then
            echo "Expected exactly one .deb and one .rpm, found ${#debs[@]} / ${#rpms[@]}" >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}"
          dpkg-deb --contents "${debs[0]}" | grep -q "usr/bin/lychi-app" \
            || { echo "deb does not contain usr/bin/lychi-app" >&2; exit 1; }
          rpm -qpi "${rpms[0]}"
          rpm -qpl "${rpms[0]}" | grep -q "/usr/bin/lychi-app" \
            || { echo "rpm does not contain /usr/bin/lychi-app" >&2; exit 1; }

      # Keyless provenance: a sigstore-signed, transparency-logged statement
      # that THIS AppImage came from THIS repo's release workflow at THIS
      # commit. Anyone can check it:
      #   gh attestation verify <AppImage> -R Shansabry/lychi-core
      # Complements (never replaces) the minisign signature the updater pins.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lychi-packages
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # The updater reads `latest.json` from the release. It is generated from
      # the signature over the FINAL (post-strip) artifact, so it can never
      # claim a version or hash the artifact does not have.
      #
      # Skipped entirely when unsigned: publishing a manifest with no signature
      # would make every client fail verification, which is worse than having no
      # manifest at all (clients then simply report "no update found").
      - name: Generate updater manifest
        if: startsWith(github.ref, 'refs/tags/v') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          # A glob, not `ls`: parsing ls output breaks on unusual filenames,
          # and nullglob makes "no match" an empty array rather than the
          # literal pattern.
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [ ${#appimages[@]} -ne 1 ]; then
            echo "Expected exactly ONE AppImage, found ${#appimages[@]}: ${appimages[*]}" >&2
            exit 1
          fi
          APPIMAGE="${appimages[0]}"
          SIG_FILE="${APPIMAGE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "No signature beside $APPIMAGE — is bundle.createUpdaterArtifacts true?" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "$(cat "$SIG_FILE")",
                "url": "${BASE}/$(basename "$APPIMAGE")"
              }
            }
          }
          EOF
          cat latest.json

      # Attaching the AppImage, its signature and the manifest to the tagged
      # release is what makes the updater endpoint resolve.
      # Immutable releases only accept asset uploads while DRAFT — publishing
      # first locks the release forever (v0.1.1 died this way). So the release
      # is created/kept as a draft, assets land, and the step after flips it
      # live in one atomic publish.
      - name: Upload release assets (draft)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            latest.json
          fail_on_unmatched_files: false

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const { data: releases } = await github.rest.repos.listReleases({
              ...context.repo, per_page: 100,
            });
            const draft = releases.find(r => r.tag_name === tag && r.draft);
            if (!draft) {
              core.setFailed(`No draft release found for ${tag}`);
              return;
            }
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: draft.id,
              draft: false,
              make_latest: 'true',
            });
            core.info(`Published ${tag} with ${draft.assets.length} assets`);

  # Publishes/updates the lychi-appimage AUR package after the release goes
  # live. Renders aur/PKGBUILD.template with the tag's version and the
  # published AppImage's checksum, then pushes PKGBUILD + .SRCINFO to the AUR.
  #
  # Requires the AUR_SSH_PRIVATE_KEY secret (an SSH key registered on the
  # Shansabry AUR account). Until it exists this job SKIPS with a notice
  # rather than failing the release — AUR is downstream of the release, never
  # a gate on it.
  aur:
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Secrets cannot appear in `if:` conditions, so the gate is a step
      # output. Everything after keys off it.
      - name: Is AUR publishing configured?
        id: gate
        env:
          KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set — skipping AUR publish."
          fi

      # The checksum comes from the PUBLISHED asset, not a local rebuild — the
      # PKGBUILD must describe the exact bytes users download.
      - name: Render PKGBUILD from the published release
        if: steps.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Lychi_${version}_amd64.AppImage"
          curl -fsSL -o /tmp/lychi.AppImage "$url"
          sha="$(sha256sum /tmp/lychi.AppImage | cut -d' ' -f1)"
          sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${sha}/" \
            aur/PKGBUILD.template > aur/PKGBUILD
          grep -E "pkgver=|sha256sums=" aur/PKGBUILD

      - name: Publish to the AUR
        if: steps.gate.outputs.enabled == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: lychi-appimage
          pkgbuild: aur/PKGBUILD
          commit_username: Shansabry
          commit_email: support@lychi.app
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
