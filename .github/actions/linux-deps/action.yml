name: Linux system deps
description: >
  The one apt step shared by every compiling job. The package list used to be
  copy-pasted across four jobs and drifted; this action is the single source
  of truth for what a build host needs.
inputs:
  tauri:
    description: Install the Tauri GTK/WebKit build stack (lychi-app). Core-only jobs set "false".
    default: "true"
  extra:
    description: Space-separated extra packages for this job
    default: ""
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      env:
        TAURI: ${{ inputs.tauri }}
        EXTRA: ${{ inputs.extra }}
      run: |
        set -euo pipefail
        packages=()
        if [ "$TAURI" = "true" ]; then
          # The -sys crates run pkg-config at build time, so even `cargo check`
          # of lychi-app needs the full stack. Matches release.yml's proven set.
          packages+=(
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
            libayatana-appindicator3-dev libgtk-layer-shell-dev
            libssl-dev libdbus-1-dev pkg-config
          )
        fi
        # Unquoted on purpose: a space-separated list that must word-split.
        # shellcheck disable=SC2206
        packages+=($EXTRA)
        if [ ${#packages[@]} -eq 0 ]; then exit 0; fi
        # A mirror hiccup should cost seconds, not a hung job. Three layers:
        # Acquire::http::Timeout makes apt abandon a STALLED connection
        # (Acquire::Retries alone only re-requests after a FAILURE — a frozen
        # TCP session never fails, which is how two jobs sat 10+ minutes on
        # the azure mirror); `timeout` bounds each attempt outright; and the
        # loop retries the whole sequence on fresh connections.
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        for attempt in 1 2 3; do
          if sudo timeout 120 apt-get update "${apt_opts[@]}" &&
             sudo timeout 420 apt-get install -y "${apt_opts[@]}" "${packages[@]}"; then
            exit 0
          fi
          echo "::warning::apt attempt ${attempt} failed; retrying"
          sleep 15
        done
        echo "::error::apt failed after 3 attempts"
        exit 1
